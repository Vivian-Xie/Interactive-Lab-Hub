<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goose Counting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: normal;
        }

        .rules {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 30px;
        }

        .rules h2 {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .rules ul {
            list-style: none;
            padding: 0;
        }

        .rules li {
            padding: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .game-area {
            min-height: 400px;
            text-align: center;
        }

        .image-container {
            margin: 20px 0;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }

        .message {
            font-size: 18px;
            margin: 20px 0;
        }

        .sub-message {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }

        .countdown {
            font-size: 72px;
            margin: 30px 0;
            font-weight: bold;
        }

        .loading {
            font-size: 14px;
            color: #666;
            margin: 20px 0;
        }

        .players {
            margin-top: 30px;
        }

        .player {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player.answered {
            background: #f9f9f9;
        }

        .player.winner {
            background: #e8e8e8;
            font-weight: bold;
        }

        .player.timeout {
            background: #f5f5f5;
            color: #999;
        }

        .player-info {
            text-align: left;
        }

        .player-name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .player-ip {
            font-size: 12px;
            color: #666;
        }

        .player-answer-section {
            text-align: right;
        }

        .player-answer {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .player-time {
            font-size: 12px;
            color: #666;
        }

        .winner-badge {
            display: inline-block;
            border: 1px solid #333;
            padding: 3px 10px;
            margin-left: 10px;
            font-size: 12px;
        }

        button {
            background: white;
            border: 1px solid #333;
            padding: 10px 30px;
            font-size: 14px;
            cursor: pointer;
            margin: 20px 0;
        }

        button:hover {
            background: #f5f5f5;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Goose Counting Game</h1>
        
        <div class="rules" id="rules">
            <h2>Game Rules:</h2>
            <ul>
                <li>The image will show for 3 seconds - count the geese quickly</li>
                <li>After the image disappears, wait for the 5-second countdown</li>
                <li>When countdown finishes, you have 5 seconds to press your button</li>
                <li>The fastest correct answer wins</li>
                <li>Ready? Click start</li>
            </ul>
            <div style="text-align: center;">
                <button onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div class="game-area hidden" id="gameArea">
            <div class="message" id="message"></div>
            <div class="sub-message" id="subMessage"></div>
            <div class="loading hidden" id="loading"></div>
            <div class="image-container hidden" id="imageContainer"></div>
            <div class="countdown hidden" id="countdown"></div>
            <div class="players hidden" id="players"></div>
        </div>
    </div>

    <script>
        let gameConfig = null;

        async function loadConfig() {
            const response = await fetch('/api/game-config');
            gameConfig = await response.json();
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function startGame() {
            document.getElementById('rules').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
            
            if (!gameConfig) {
                await loadConfig();
            }
            
            await showLoading('Preparing game...');
            await wait(1000);
            
            await showImage();
            await wait(gameConfig.image_display_time * 1000);
            
            await hideImage();
            await wait(300);
            
            await showCountdownBeforeAnswer();
            await wait(gameConfig.countdown_before_answer * 1000 + 100);
            
            await showAnswerPhase();
        }

        async function showLoading(text) {
            document.getElementById('message').textContent = text;
            document.getElementById('loading').textContent = 'Loading...';
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        async function showImage() {
            hideLoading();
            const message = document.getElementById('message');
            const subMessage = document.getElementById('subMessage');
            const imageContainer = document.getElementById('imageContainer');
            
            message.textContent = 'Count the geese quickly';
            subMessage.textContent = 'You have ' + gameConfig.image_display_time + ' seconds';
            
            imageContainer.innerHTML = '<img src="https://github.com/Vivian-Xie/Interactive-Lab-Hub/blob/Fall2025/Lab%206/imgs/geese.png?raw=true" alt="Geese">';
            imageContainer.classList.remove('hidden');
        }

        async function hideImage() {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.classList.add('hidden');
        }

        async function showCountdownBeforeAnswer() {
            const message = document.getElementById('message');
            const subMessage = document.getElementById('subMessage');
            const countdown = document.getElementById('countdown');
            
            message.textContent = 'Get ready';
            subMessage.textContent = 'Countdown starting';
            
            countdown.classList.remove('hidden');
            
            for (let i = gameConfig.countdown_before_answer; i > 0; i--) {
                countdown.textContent = i;
                await wait(1000);
            }
            
            countdown.classList.add('hidden');
        }

        async function showAnswerPhase() {
            const message = document.getElementById('message');
            const subMessage = document.getElementById('subMessage');
            
            message.textContent = 'Press your button NOW';
            subMessage.textContent = 'You have ' + gameConfig.answer_time_limit + ' seconds';
            
            await wait(100);
            await showPlayers();
        }

        async function showPlayers() {
            const playersDiv = document.getElementById('players');
            playersDiv.classList.remove('hidden');
            playersDiv.innerHTML = '';
            
            // Create player elements
            gameConfig.players.forEach((player, index) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player';
                playerDiv.id = 'player-' + player.id;
                playerDiv.innerHTML = `
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        <div class="player-ip">IP: ${player.ip}</div>
                    </div>
                    <div class="player-answer-section">
                        <div class="player-answer" id="answer-${player.id}">Waiting...</div>
                        <div class="player-time" id="time-${player.id}"></div>
                    </div>
                `;
                playersDiv.appendChild(playerDiv);
            });
            
            await wait(500);
            
            // Sort players by response time
            const sortedPlayers = [...gameConfig.players]
                .filter(p => p.status === 'answered')
                .sort((a, b) => a.response_time - b.response_time);
            
            let winnerFound = false;
            
            // Show results directly without counting animation
            for (const player of sortedPlayers) {
                // Wait for player's response time
                // await wait(player.response_time * 1000);
                
                // Show final answer immediately
                const playerDiv = document.getElementById('player-' + player.id);
                const answerDiv = document.getElementById('answer-' + player.id);
                const timeDiv = document.getElementById('time-' + player.id);
                
                playerDiv.classList.add('answered');
                answerDiv.textContent = 'Answer: ' + player.answer;
                timeDiv.textContent = 'Time: ' + player.response_time + 's';
                
                // Check if correct and first
                if (player.answer === gameConfig.correct_answer && !winnerFound) {
                    // await wait(300);
                    playerDiv.classList.remove('answered');
                    playerDiv.classList.add('winner');
                    playerDiv.querySelector('.player-answer-section').innerHTML += 
                        '<span class="winner-badge">WINNER</span>';
                    winnerFound = true;
                    
                    document.getElementById('message').textContent = 
                        player.name + ' wins';
                    document.getElementById('subMessage').textContent = 
                        'Correct answer: ' + gameConfig.correct_answer + ' geese | Time: ' + player.response_time + 's';
                }
            }
            
            // Show timeout players after 5 seconds
            await wait((gameConfig.answer_time_limit + 0.5) * 1000);
            
            gameConfig.players.forEach(player => {
                if (player.status === 'timeout') {
                    const playerDiv = document.getElementById('player-' + player.id);
                    const answerDiv = document.getElementById('answer-' + player.id);
                    
                    playerDiv.classList.add('timeout');
                    answerDiv.textContent = 'No answer';
                }
            });
        }

        loadConfig();
    </script>
</body>
</html>
